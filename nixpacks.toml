[phases.setup]
nixPkgs = ["php84", "php84Extensions.mbstring", "php84Extensions.xml", "php84Extensions.tokenizer", "php84Extensions.ctype", "php84Extensions.fileinfo", "php84Extensions.pdo", "php84Extensions.pdo_mysql", "php84Extensions.openssl", "php84Extensions.gd", "php84Extensions.curl", "php84Extensions.zip", "php84Extensions.bcmath", "php84Extensions.intl", "php84Extensions.exif", "php84Packages.composer"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
  "php artisan storage:link"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=UserAdminSeeder --force && php artisan db:seed --class=FaqSeeder --force && php artisan db:seed --class=OldDataSeeder --force && php -S 0.0.0.0:$PORT -t public"

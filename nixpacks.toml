[phases.setup]
nixPkgs = ["php82", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.tokenizer", "php82Extensions.ctype", "php82Extensions.fileinfo", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.openssl", "php82Extensions.gd", "php82Extensions.curl", "php82Extensions.zip", "php82Extensions.bcmath", "php82Extensions.intl", "php82Extensions.exif", "php82Packages.composer"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
  "php artisan storage:link"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=UserAdminSeeder --force && php artisan db:seed --class=FaqSeeder --force && php artisan db:seed --class=OldDataSeeder --force && php -S 0.0.0.0:$PORT -t public"

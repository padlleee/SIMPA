[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist"
]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan storage:link --force && php artisan migrate --force && php artisan db:seed --class=UserAdminSeeder --force && php artisan db:seed --class=FaqSeeder --force && php artisan db:seed --class=OldDataSeeder --force && php -S 0.0.0.0:$PORT -t public"
